<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: #0d0d10;
  color: #f5f5f7;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
.wrap {
  max-width: 440px;
  margin: 0 auto;
  padding: 20px 20px 64px;
  text-align: center;
}
.hero {
  width: 100%;
  height: auto;
  border-radius: 16px;
  display: block;
  margin: 0 auto 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
}
.btn {
  display: block;
  width: 100%;
  background: #32CD32;
  color: #0E160E;
  text-decoration: none;
  font-weight: 700;
  font-size: 18px;
  padding: 14px 16px;
  border-radius: 12px;
  margin: 0 0 10px;
  line-height: 1.2;
}
.btn.secondary {
  background: transparent;
  border: 2px solid #32CD32;
  color: #32CD32;
}
.btn:hover { opacity: 0.92; }
.addr {
  display: block;
  color: #c8c8ce;
  text-decoration: none;
  font-size: 15px;
  line-height: 1.4;
  margin: 8px 0 24px;
}
.services {
  list-style: none;
  text-align: left;
  max-width: 320px;
  margin: 0 auto 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
}
.services li {
  position: relative;
  padding-left: 16px;
  font-size: 15px;
  color: #f5f5f7;
}
.services li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.55em;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #32CD32;
}
.more {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 8px 0 28px;
}
.more img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  display: block;
}
.foot {
  font-size: 11px;
  color: #6e6e78;
  margin-top: 16px;
}
